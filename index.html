<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yamala Liel Stephen — AI/ML Engineer</title>
  <meta name="description" content="Portfolio of Yamala Liel Stephen — AI/ML Engineer specializing in Machine Learning Systems, Computer Vision, MLOps, and Backend Architecture.">

  <!-- Google Fonts: Geist 400, 500 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* =====================================================================
       1. FONTS & GLOBAL VARIABLES & RESET
       ===================================================================== */
    :root {
      --ink:   #0b1013;
      --panel: rgba(14, 19, 23, 0.88);
      --line:  rgba(255, 255, 255, 0.08);
      --hover: rgba(255, 255, 255, 0.065);
      --text:  #ffffff;
      --soft:  rgba(255, 255, 255, 0.74);
      --muted: rgba(255, 255, 255, 0.60);
      --ease:  cubic-bezier(0.22, 1, 0.36, 1);
      --accent: #5ce1e6;
      --accent-glow: rgba(92, 225, 230, 0.4);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--ink);
      color: var(--text);
      font-family: "Geist", "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    img {
      display: block;
    }

    :focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
      border-radius: 6px;
    }

    /* =====================================================================
       2. HERO SECTION & BACKGROUND
       ===================================================================== */
    .hero {
      position: relative;
      height: 100vh;
      height: 100svh;
      min-height: 640px;
      overflow: hidden;
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: -2;
      background: #1b2a30 url("https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260928_144652_9eaf1d6a-3e8d-4460-bd5b-0ec7221685a0.png") center 45% / cover no-repeat;
      animation: heroIn 2.4s var(--ease) both;
    }

    @keyframes heroIn {
      from {
        transform: scale(1.08);
        filter: brightness(0.5);
      }
      to {
        transform: scale(1);
        filter: brightness(0.9);
      }
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(6,10,12,0.45) 0%, rgba(6,10,12,0.15) 30%, rgba(6,10,12,0.6) 80%, rgba(11,16,19,1) 100%);
    }

    /* Hero Center Stage */
    .hero-center {
      position: relative;
      z-index: 5;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      max-width: 960px;
      animation: fadeUpHero 1.2s var(--ease) 0.4s both;
    }

    @keyframes fadeUpHero {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.85);
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .hero-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px #4ade80;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .hero-name {
      font-size: clamp(36px, 6.2vw, 74px);
      font-weight: 500;
      letter-spacing: -0.03em;
      margin: 0;
      color: #ffffff;
      text-shadow: 0 4px 35px rgba(0, 0, 0, 0.7);
      line-height: 1.1;
    }

    .hero-role-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 44px;
    }

    .breathing-text {
      font-size: clamp(17px, 2.8vw, 26px);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(92, 225, 230, 0.2);
      animation: breathingGlow 3.2s ease-in-out infinite;
      transition: opacity 0.35s ease, transform 0.35s ease;
      display: inline-block;
    }

    @keyframes breathingGlow {
      0%, 100% {
        opacity: 0.85;
        transform: scale(0.98);
        filter: drop-shadow(0 0 8px rgba(92, 225, 230, 0.3));
      }
      50% {
        opacity: 1;
        transform: scale(1.02);
        filter: drop-shadow(0 0 22px rgba(92, 225, 230, 0.85));
      }
    }

    .cursor-pulse {
      font-size: clamp(18px, 3vw, 28px);
      font-weight: 300;
      color: var(--accent);
      animation: blinkCursor 0.9s infinite;
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
    }

    .scroll-cue {
      position: absolute;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13.5px;
      letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.45);
      animation: fadeUp 1s var(--ease) 1s both;
      z-index: 5;
    }

    .scroll-cue span:first-child,
    .scroll-cue span:last-child {
      opacity: 0.8;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translate(-50%, 10px);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    /* =====================================================================
       3. HEADER BAR
       ===================================================================== */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
    }

    .bar {
      height: 76px;
      padding: 0 clamp(20px, 3.4vw, 52px);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      justify-self: start;
      font-size: 15.5px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: #fff;
      animation: fadeDown 0.9s var(--ease) 0.35s backwards;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.03));
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--accent);
      box-shadow: 0 0 14px rgba(92, 225, 230, 0.25);
    }

    .desktop-nav {
      animation: fadeIn 0.9s ease 0.45s backwards;
      position: static;
    }

    .links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .plain-link {
      display: inline-flex;
      align-items: center;
      padding: 8px 0;
      font-size: 14.5px;
      color: var(--soft);
      transition: color 0.25s ease;
      position: relative;
    }

    .plain-link:hover,
    .plain-link.is-active {
      color: #fff;
    }

    .plain-link::after {
      content: "";
      position: absolute;
      bottom: 2px;
      left: 0;
      right: 0;
      height: 1px;
      background: #fff;
      transform: scaleX(0);
      transition: transform 0.25s ease;
    }

    .plain-link:hover::after {
      transform: scaleX(1);
    }

    .actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fadeDown 0.9s var(--ease) 0.55s backwards;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 18px;
      border-radius: 999px;
      background: #fff;
      color: #0b0f12;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .cta:hover {
      background: #e9eef0;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.2);
    }

    .menu-btn {
      display: none;
    }

    /* =====================================================================
       4. MOBILE SHEET & MEDIA QUERIES (<= 860px)
       ===================================================================== */
    .sheet {
      display: none;
    }

    @media (max-width: 860px) {
      .bar {
        grid-template-columns: 1fr auto;
      }

      .desktop-nav {
        display: none;
      }

      .menu-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 32px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
      }

      .menu-btn svg {
        width: 16px;
        height: 16px;
      }

      .sheet {
        display: block;
        position: absolute;
        top: 68px;
        left: 12px;
        right: 12px;
        padding: 14px;
        border-radius: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        -webkit-backdrop-filter: blur(22px) saturate(140%);
        backdrop-filter: blur(22px) saturate(140%);
        max-height: calc(100svh - 90px);
        overflow-y: auto;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-6px) scale(0.98);
        transform-origin: 50% 0;
        transition: opacity 0.3s ease, transform 0.45s var(--ease), visibility 0s linear 0.45s;
        z-index: 30;
      }

      .sheet.open {
        opacity: 1;
        visibility: visible;
        transform: none;
        transition: opacity 0.3s ease, transform 0.45s var(--ease), visibility 0s;
      }

      .sheet h3 {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 12px 12px 6px;
      }

      .sheet a {
        display: block;
        padding: 11px 12px;
        border-radius: 9px;
        font-size: 15px;
        color: #fff;
        transition: background 0.2s ease;
      }

      .sheet a:hover,
      .sheet a:focus-visible {
        background: var(--hover);
      }
    }

    @media (min-width: 861px) {
      .sheet {
        display: none !important;
      }
    }

    /* =====================================================================
       PORTFOLIO & CONTENT SECTIONS (Below Hero)
       ===================================================================== */
    .content-container {
      max-width: 1160px;
      margin: 0 auto;
      padding: 90px clamp(20px, 4vw, 48px);
    }

    .section-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--soft);
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--hover);
      border: 1px solid var(--line);
      margin-bottom: 20px;
    }

    .profile-hero {
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(17, 24, 29, 0.9), rgba(11, 16, 19, 0.95));
      border: 1px solid var(--line);
      padding: clamp(32px, 5vw, 64px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      margin-bottom: 80px;
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .profile-title-group h1 {
      font-size: clamp(32px, 4.5vw, 52px);
      font-weight: 500;
      letter-spacing: -0.02em;
      margin: 0 0 10px 0;
      color: #fff;
    }

    .profile-role {
      font-size: clamp(16px, 2vw, 20px);
      color: var(--soft);
      margin: 0 0 8px 0;
      font-weight: 400;
    }

    .profile-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      font-size: 14px;
      color: var(--muted);
      margin-top: 6px;
    }

    .profile-meta a {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }

    .profile-meta a:hover {
      color: var(--accent);
    }

    .profile-summary {
      margin-top: 24px;
      font-size: 16.5px;
      line-height: 1.68;
      color: rgba(255, 255, 255, 0.82);
      max-width: 900px;
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 32px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
    }

    .stat-num {
      font-size: 28px;
      font-weight: 500;
      color: #fff;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }

    /* Skills Grid */

      font-size: clamp(24px, 3vw, 32px);
      font-weight: 500;
      letter-spacing: -0.01em;
      margin: 0 0 32px 0;
      color: #fff;
    }

</style></head><body></body></html>
