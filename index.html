<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yamala Liel Stephen — AI/ML Engineer</title>
  <meta name="description" content="Portfolio of Yamala Liel Stephen — AI/ML Engineer specializing in Machine Learning Systems, Computer Vision, MLOps, and Backend Architecture.">

  <!-- Google Fonts: Geist 400, 500 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* =====================================================================
       1. FONTS & GLOBAL VARIABLES & RESET
       ===================================================================== */
    :root {
      --ink:   #0b1013;
      --panel: rgba(14, 19, 23, 0.88);
      --line:  rgba(255, 255, 255, 0.08);
      --hover: rgba(255, 255, 255, 0.065);
      --text:  #ffffff;
      --soft:  rgba(255, 255, 255, 0.74);
      --muted: rgba(255, 255, 255, 0.60);
      --ease:  cubic-bezier(0.22, 1, 0.36, 1);
      --accent: #5ce1e6;
      --accent-glow: rgba(92, 225, 230, 0.4);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--ink);
      color: var(--text);
      font-family: "Geist", "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    img {
      display: block;
    }

    :focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
      border-radius: 6px;
    }

    /* =====================================================================
       2. HERO SECTION & BACKGROUND
       ===================================================================== */
    .hero {
      position: relative;
      height: 100vh;
      height: 100svh;
      min-height: 640px;
      overflow: hidden;
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: -2;
      background: #1b2a30 url("https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260928_144652_9eaf1d6a-3e8d-4460-bd5b-0ec7221685a0.png") center 45% / cover no-repeat;
      animation: heroIn 2.4s var(--ease) both;
    }

    @keyframes heroIn {
      from {
        transform: scale(1.08);
        filter: brightness(0.5);
      }
      to {
        transform: scale(1);
        filter: brightness(0.9);
      }
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(6,10,12,0.45) 0%, rgba(6,10,12,0.15) 30%, rgba(6,10,12,0.6) 80%, rgba(11,16,19,1) 100%);
    }

    /* Hero Center Stage */
    .hero-center {
      position: relative;
      z-index: 5;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      max-width: 960px;
      animation: fadeUpHero 1.2s var(--ease) 0.4s both;
    }

    @keyframes fadeUpHero {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.85);
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--line);
 
</style></head><body></body></html>
