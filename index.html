  <style>
    /* =====================================================================
       1. FONTS & GLOBAL VARIABLES & RESET
       ===================================================================== */
    :root {
      --ink:   #0b1013;
      --panel: rgba(14, 19, 23, 0.88);
      --line:  rgba(255, 255, 255, 0.08);
      --hover: rgba(255, 255, 255, 0.065);
      --text:  #ffffff;
      --soft:  rgba(255, 255, 255, 0.74);
      --muted: rgba(255, 255, 255, 0.60);
      --ease:  cubic-bezier(0.22, 1, 0.36, 1);
      --accent: #5ce1e6;
      --accent-glow: rgba(92, 225, 230, 0.4);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--ink);
      color: var(--text);
      font-family: "Geist", "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    img {
      display: block;
    }

    :focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
      border-radius: 6px;
    }

    /* =====================================================================
       2. HERO SECTION & BACKGROUND
       ===================================================================== */
    .hero {
      position: relative;
      height: 100vh;
      height: 100svh;
      min-height: 640px;
      overflow: hidden;
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: -2;
      background: #1b2a30 url("https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260928_144652_9eaf1d6a-3e8d-4460-bd5b-0ec7221685a0.png") center 45% / cover no-repeat;
      animation: heroIn 2.4s var(--ease) both;
    }
